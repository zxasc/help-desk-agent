name: CI

on:
  pull-request:

jobs:
  tox:
    name: ${{ matrix.env }}
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        env: [lint, type, test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uvx --with tox-uv tox -e ${{ matrix.env }}
