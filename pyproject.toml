[project]
name = "help_desk_agent"
version = "0.1.0"
description = "CityWheel CLI Agent"
readme = "README.md"
authors = [
    { name = "zxasc", email = "pawel@lechocki.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "httpx2>=2.16.0",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.2",
]

[project.scripts]
help_desk_agent = "help_desk_agent.cli:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
