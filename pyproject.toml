[project]
name = "help_desk_agent"
version = "0.1.0"
description = "CityWheel CLI Agent"
readme = "README.md"
authors = [
    { name = "zxasc", email = "pawel@lechocki.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "httpx2>=2.16.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tenacity>=9.1.2",
]

[project.scripts]
help_desk_agent = "help_desk_agent.cli:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.11"]
env_list = ["lint", "type", "test"]

[tool.tox.env_run_base]
dependency_groups = ["dev"]

[tool.tox.env.test]
description = "Run the test suite with pytest"
commands = [["pytest", { replace = "posargs", extend = true }]]

[tool.tox.env.lint]
description = "Check linting and formatting with ruff"
skip_install = true
commands = [
    ["ruff", "check", "src", "tests"],
    ["ruff", "format", "--check", "src", "tests"],
]

[tool.tox.env.type]
description = "Type check with mypy"
commands = [["mypy", "src", "tests"]]

[tool.tox.env.format]
description = "Fix lint issues and format code with ruff"
skip_install = true
commands = [
    ["ruff", "check", "--fix", "src", "tests"],
    ["ruff", "format", "src", "tests"],
]
